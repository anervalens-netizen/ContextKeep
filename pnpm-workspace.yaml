packages:
  - "apps/*"
  - "packages/*"

# security/esbuild-ghsa-67mh
# Patch the single vulnerable esbuild edge pulled in by drizzle-kit's
# deprecated @esbuild-kit/* wrappers. The override is scoped to the exact
# parent so the patched copies already used by vite/tsx/drizzle-kit-direct
# (0.25.12, 0.28.2) stay untouched. Resolves GHSA-67mh-4wv8-2f99.
overrides:
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  # Patch audited transitive versions without crossing their major versions.
  "fast-uri@3.1.7": "3.1.8"
  "fast-uri@4.1.4": "4.1.5"
  "ip-address@10.7.0": "10.7.1"
  "brace-expansion@2.1.4": "2.1.7"
  "brace-expansion@5.0.9": "5.0.12"
  # GHSA-gfhx-hw2g-v5hg: build-only serializer function-body escaping fix.
  "serialize-javascript@7.1.1": "7.1.2"
  # GHSA-68fv-2mgg-jv7q: patch the vulnerable source-map implementation.
  "source-map-js@<1.2.2": "1.2.2"
  '@modelcontextprotocol/client@>=2.0.0 <2.3.0': ^2.3.0
  '@modelcontextprotocol/sdk@<1.32.0': ^1.32.0
  '@modelcontextprotocol/sdk@>=1.24.0 <1.32.0': ^1.32.0
  '@modelcontextprotocol/sdk@>=1.3.0 <1.32.0': ^1.32.0
  '@modelcontextprotocol/sdk@>=1.6.0 <1.32.0': ^1.32.0
  '@vitest/mocker@>=5.0.0-beta.1 <5.0.3': ^5.0.3
  '@vitest/mocker@>=5.0.0-rc.2 <5.0.3': ^5.0.3
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=3.1.3 <3.1.9: ^3.1.9
  fast-uri@>=4.0.0 <4.2.3: ^4.2.3
  fast-uri@>=4.0.1 <4.2.3: ^4.2.3
  hono@>=4.12.4 <4.13.11: ^4.13.11
  ip-address@<=10.7.3: ^10.7.4
  serialize-javascript@<7.1.3: ^7.1.3
  undici@>=8.0.0 <8.12.2: ^8.12.2
  vite@>=8.2.0 <=8.2.3: ^8.2.4
  zod@<4.6.6: ^4.6.6

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
allowBuilds:
  better-sqlite3: true
  esbuild: true
# Exact stable SDK revisions reviewed and tested for CV07. General release-age
# policy remains unchanged; this is not an exclusion for future versions.
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/client@2.1.0'
  - '@modelcontextprotocol/core@2.1.0'
  - '@modelcontextprotocol/node@2.1.0'
  - '@modelcontextprotocol/sdk@1.30.1'
  - '@modelcontextprotocol/server@2.1.0'
  - '@openai/mcp-extensions@0.1.0'
