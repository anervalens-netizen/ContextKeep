name: ContextKeep release gate (self-hosted, explicit)

# This workflow is intentionally dispatch-only. It never runs untrusted pull
# request code on a private/self-hosted runner. Use the fast Gaming workflow
# for a narrow manual check; this is the full certification gate.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Trusted branch or commit to certify"
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  release:
    name: full release gate
    runs-on: [self-hosted, Linux, X64, contextkeep-build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full release gate
        env:
          NODE_ENV: production
        run: pnpm release:gate
